name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build meltycat.exe
        shell: cmd
        run: call build.cmd

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/meltycat-windows-x64 | Out-Null
          Copy-Item build/meltycat.exe, LICENSE dist/meltycat-windows-x64
          Compress-Archive -Path dist/meltycat-windows-x64/* -DestinationPath dist/meltycat-windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: meltycat-windows-x64
          path: dist/meltycat-windows-x64.zip

  # The macOS job stays dormant until Swift sources exist in macos/Sources.
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Look for macOS sources
        id: probe
        run: |
          if ls macos/Sources/*.swift >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Swift sources in macos/Sources yet; skipping macOS build."
          fi

      - name: Build universal meltycat.app
        if: steps.probe.outputs.present == 'true'
        run: |
          VERSION="0.0.0"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          bash macos/build.sh "$VERSION"

      - name: Package
        if: steps.probe.outputs.present == 'true'
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent macos/build/meltycat.app dist/meltycat-macos-universal.zip

      - name: Upload artifact
        if: steps.probe.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: meltycat-macos-universal
          path: dist/meltycat-macos-universal.zip

  release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
